// Update Gradle Wrapper using: ./gradlew wrapper --distribution-type bin --gradle-version <version>
// See Gradle's releases here: https://gradle.org/releases/

plugins {
    alias(libs.plugins.fabricLoom)
    //alias(libs.plugins.shadow)
}

dependencies {
    minecraft(libs.minecraft)
    mappings(loom.layered() {
        officialMojangMappings()
    })

    modImplementation(libs.fabricLoader)
    modImplementation(libs.fabricApi)

    modImplementation(libs.owoLib)
    include(libs.owoSentinel)

    modImplementation(libs.modMenu)

    implementation(libs.sqlite)
    include(libs.sqlite)

    compileOnly(libs.zstd)
    implementation(variantOf(libs.zstd) { classifier("linux_amd64") })
    implementation(variantOf(libs.zstd) { classifier("linux_aarch64") })
    implementation(variantOf(libs.zstd) { classifier("darwin_x86_64") })
    implementation(variantOf(libs.zstd) { classifier("darwin_aarch64") })
    implementation(variantOf(libs.zstd) { classifier("win_amd64") })
    implementation(variantOf(libs.zstd) { classifier("win_aarch64") })
    include(variantOf(libs.zstd) { classifier("linux_amd64") })
    include(variantOf(libs.zstd) { classifier("linux_aarch64") })
    include(variantOf(libs.zstd) { classifier("darwin_x86_64") })
    include(variantOf(libs.zstd) { classifier("darwin_aarch64") })
    include(variantOf(libs.zstd) { classifier("win_amd64") })
    include(variantOf(libs.zstd) { classifier("win_aarch64") })
}

// Dev-only tools, e.g. the fake /jalist, as a second mod in src/testmod. ./gradlew runClient
// loads it beside CivModern; the jar (and dist/) is built from the main source set alone, so it
// never ships. The same arrangement Fabric API uses for its own test mods.
sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    mods {
        civmodern {
            sourceSet sourceSets.main
        }
        "civmodern-testmod" {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        client {
            source sourceSets.testmod
        }
    }
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url 'https://maven.wispforest.io/releases/' }
    maven { url 'https://jitpack.io' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    withSourcesJar()
}

processResources {
    def expansions = [
        "mod_name"             : project.mod_name,
        "mod_version"          : project.mod_version,
        "mod_description"      : project.mod_description,
        // Consumed by the %FABRIC_AUTHORS_ARRAY% filter below; declared here so an authors
        // change is seen by the up-to-date check and actually reruns this task.
        "mod_authors"          : project.mod_authors,
        "mod_home_url"         : project.mod_home_url,
        "mod_source_url"       : project.mod_source_url,
        "copyright_licence"    : project.copyright_licence,
        "minecraft_version"    : libs.versions.minecraft.get(),
        "fabric_loader_version": libs.versions.fabricLoader.get(),
    ]
    inputs.properties(expansions)
    filesMatching("assets/civmodern/lang/en_us.json") {
        expand(expansions)
    }
    filesMatching("fabric.mod.json") {
        expand(expansions)
        filter {
            (it as String).replace(
                    "\"%FABRIC_AUTHORS_ARRAY%\"",
                    new JsonBuilder((project.mod_authors as String).tokenize(",")).toString()
            )
        }
    }
}

import groovy.json.JsonBuilder

tasks.register("cleanJar", Delete) {
    delete fileTree("dist") {
        include "*.jar"
    }
}

tasks.register("copyJar", Copy) {
    dependsOn cleanJar
    from remapJar
    into "dist"
}

build.dependsOn copyJar
// Compiled (not packaged) on every build, so a change that breaks the testmod shows up here
// rather than only on the next runClient.
build.dependsOn compileTestmodJava
